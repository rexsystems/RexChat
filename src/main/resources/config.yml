# RexChat Configuration

config-version: 2

# Update checker
update-checker:
  enabled: true
  notify-ops-on-join: false
  permission: "rexchat.admin"
  message: "%rc_prefix%&fA new version of &cRexChat &fis available: &c{latest}&7 (current: &f{current}&7). &fDownload: &chttps://www.spigotmc.org/resources/rexchat.122562/"

# Plugin messages
messages:
  prefix: "&7[&6RexChat&7] "
  no-permission: "%rc_prefix%&fYou don't have permission to use this command."
  reload-success: "%rc_prefix%&fReloaded successfully!"
  command-not-found: "%rc_prefix%&fCommand not found."
  reload-usage: "%rc_prefix%&fUsage: /%cmd% reload"
  player-only: "%rc_prefix%&fThis command can only be used by players!"
  mention:
    sender: "%rc_prefix%&aYou mentioned &6{targets}"
    target: "%rc_prefix%&eYou were mentioned by &6{sender}"
    prevent-self: true
  preview:
    target-not-found: "%rc_prefix%&cPlayer not found."
    item:
      title: "&6Item: &f{player}"
      none: "%rc_prefix%&7You are not holding any item."
      hover: "&7Click to view {player}'s item"
      text: "&7[&f{Item} &bx{Amount}&7]"
      singular-text: "&7[&f{Item}&7]"
      empty-label: "&7[&eHold an item to show it&7]"
      token-empty-error: "%rc_prefix%&cYou need to hold an item to show it."
      open: "%rc_prefix%&7Opening item preview for &6{player}"
    inventory:
      title: "&6Inventory: &f{player}"
      hover: "&7Click to view {player}'s inventory"
      label-template: "&7[&fInventory&7]"
      open: "%rc_prefix%&7Opening inventory preview for &6{player}"
    enderchest:
      title: "&6Ender Chest: &f{player}"
      hover: "&7Click to view {player}'s ender chest"
      label-template: "&7[&5Ender Chest&7]"
      open: "%rc_prefix%&7Opening ender chest preview for &6{player}"
    balance:
      # Placeholders: {balance} (formatted), {amount} (raw decimal), {currency}, {player}
      label-template: "&7[&a{balance}&7]"
      hover: "&7Balance of &6{player}&7: &a{balance}"
      unavailable-label: "&7[&cBalance unavailable&7]"
    coords:
      label-template: "&7[&b{x}, {y}, {z}&7]"
      hover: "&7Click to copy coordinates\n&7Staff: &f/rexchat tpcoords {id}"
      copy-format: "{x} {y} {z}"
      teleport-success: "%rc_prefix%&aTeleported to &6{player}&a's coordinates &7({x}, {y}, {z})"

# Mention behaviour
mention:
  enabled: true
  color: "&6"
  by-name: true
  sound:
    enabled: true
    name: "ENTITY_EXPERIENCE_ORB_PICKUP"
    volume: 0.8
    pitch: 1.2
  notify:
    sender: false
    target: true
  title:
    enabled: true
    title: "&6Mention!"
    subtitle: "&eYou were mentioned by &6{sender}"
    fade-in: 5
    stay: 40
    fade-out: 10

# Join / leave messages (leave blank to disable)
join-leave:
  join-message: ""
  leave-message: ""

# When enabled, RexChat sends chat as system messages to bypass 1.19+ chat
# reporting / signed-message validation.
chat-reporting:
  disable: true


# Chat colour presets selectable with /chatcolor.
chatcolor:
  enabled: true
  colors:
    red:
      format: "&c"
      permission: "rexchat.chatcolor.red"
      display-name: "Red"
    gold:
      format: "&6"
      permission: "rexchat.chatcolor.gold"
      display-name: "Gold"
    green:
      format: "&a"
      permission: "rexchat.chatcolor.green"
      display-name: "Green"
    aqua:
      format: "&b"
      permission: "rexchat.chatcolor.aqua"
      display-name: "Aqua"
    pink:
      format: "&d"
      permission: "rexchat.chatcolor.pink"
      display-name: "Pink"
    rainbow:
      format: '<rainbow>'
      permission: "rexchat.chatcolor.rainbow"
      display-name: "&cR&6a&ei&an&bb&do&5w"
    sunset:
      format: '<gradient:#FF6B6B:#FFE66D>'
      permission: "rexchat.chatcolor.sunset"
      display-name: "Sunset"
    ocean:
      format: '<gradient:#00B4DB:#0083B0>'
      permission: "rexchat.chatcolor.ocean"
      display-name: "Ocean"

# Chat formatting
#
# Format placeholders:
#   {player}, {display_name}, {message}, {prefix},
#   {world}, {health}, {max_health}, {x}, {y}, {z}, {ping}
#
# Permissions:
#   rexchat.chatcolor              - allow colour codes in chat (&c, &#FF0000, #FF0000)
#   rexchat.chat.minimessage       - allow MiniMessage tags in chat (<gradient>, <hover>, <click>, ...)
#   rexchat.chat.placeholders      - allow PlaceholderAPI placeholders in chat
chat-format:
  enabled: true
  format: "{prefix}&7{player}: &f{message}"
  player:
    hover:
      enabled: true
      lines:
        - "&7Health: &c{health}&7/&c{max_health}"
        - "&7World: &f{world}"
        - "&7Location: &f{x}&7, &f{y}&7, &f{z}"
        - "&7Ping: &f{ping}ms"
    click:
      type: suggest_command
      value: "/msg {player} "

  # Group overrides. First matching group wins. Resolved via the player's
  # LuckPerms / Vault primary group, or via an explicit `permission:` below.
  groups:
    helper:
      # permission: "group.helper"
      format: "{prefix}&7{player}: &a{message}"
      hover:
        enabled: true
        lines:
          - "&aHelper &7• &fPing: {ping}ms"
    moderator:
      # permission: "group.moderator"
      format: "{prefix}&7{player}: &b{message}"
      hover:
        enabled: true
        lines:
          - "&bModerator &7• &fPing: {ping}ms"
    admin:
      # permission: "group.admin"
      format: "{prefix}&7{player}: &c{message}"
      hover:
        enabled: true
        lines:
          - "&cAdmin &7• &fPing: {ping}ms"

# Chat emojis. Add your own under `emojis:`.
chat-emoji:
  enabled: true
  emojis:
    - name: "smile"
      aliases: [":)", ":smile:"]
      replacement: "☺"
    - name: "heart"
      aliases: ["<3", ":heart:"]
      replacement: "❤"

# Chat preview tokens. Anything in these lists, when typed in chat, expands
# into a clickable preview (item / inventory / ender chest / balance).
chat-previews:
  enabled: true
  tokens:
    item: ["[item]", "[i]", "{item}", "{i}"]
    inventory: ["[inventory]", "[inv]", "{inventory}", "{inv}"]
    enderchest: ["[enderchest]", "[ec]", "[echest]", "{enderchest}", "{ec}", "{echest}"]
    coords: ["[coords]", "[here]", "{coords}", "{here}"]
    # Requires Vault + an Economy plugin (EssentialsX, CMI, ...) for [bal]/[money].
    balance: ["[balance]", "[bal]", "[money]", "{balance}", "{bal}", "{money}"]
  # Config-defined custom clickable tokens. Plugins can also register tokens via RexChatAPI.
  custom-tokens:
    discord:
      enabled: false
      tokens: ["[discord]", "{discord}"]
      label: "&9[&bDiscord&9]"
      hover: "&7Click to open our Discord"
      click-type: open_url
      click-value: "https://discord.gg/yourserver"
      permission: ""

# DiscordSRV integration (optional, soft-dependency).
# Renders [item] / [inv] / [ec] as proper Minecraft-style images and attaches
# them to the relayed Discord message.
chat-discord:
  enabled: true
  # Set to true if a preview isn't appearing in Discord and you need verbose
  # logs (texture downloads, block resolver decisions, armour overlays).
  debug: false
  previews:
    item: true
    # When [item] is a container (shulker, barrel, bundle, decorated pot), attach a contents embed.
    item-container-contents: true
    # Legacy alias — still honoured if item-container-contents is absent.
    item-shulker-contents: true
    inventory: true
    enderchest: true
  # Static labels shown in chat in place of the token. The [item] label is
  # generated dynamically (e.g. "[Diamond Sword × 32]").
  labels:
    inventory: "[Inventory]"
    enderchest: "[Ender Chest]"
    balance-unavailable: "(balance unavailable)"
  embeds:
    item:
      title: "{player}'s item"
      color: "#5865F2"
      # Square pixel size of the rendered item icon (small thumbnail in the
      # embed corner). The bigger MC-style hover tooltip is sized automatically.
      icon-pixels: 96
      shulker:
        color: "#9B59B6"
      container:
        color: "#9B59B6"
    inventory:
      title: "{player}'s inventory"
      color: "#57F287"
    enderchest:
      title: "{player}'s ender chest"
      color: "#9B59B6"

# Mute / clear / proximity (local) chat.
chat-management:
  mute:
    enabled: true
    permission: "rexchat.mute"
    muted-message: "%rc_prefix%&fThe chat is currently muted."
    mute-announcement: "%rc_prefix%&fThe chat has been muted by {player}"
    unmute-announcement: "%rc_prefix%&fThe chat has been unmuted by {player}"
  clear:
    enabled: true
    permission: "rexchat.clear"
    clear-message: "%rc_prefix%&fThe chat has been cleared by {player}"
    lines: 100
  proximity:
    enabled: false
    radius: 100
    bypass-permission: "rexchat.proximity.bypass"
    no-recipients-message: "%rc_prefix%&7No one is nearby to hear you."
    show-range-indicator: false
    range-indicator: "&7[Local] "
    global-enabled: "%rc_prefix%&aGlobal chat enabled. Everyone will see your messages."
    local-enabled: "%rc_prefix%&eLocal chat enabled. Only nearby players will see your messages."

# Custom info commands.
commands:
  discord:
    enabled: true
    command: "discord"
    aliases: ["dc"]
    permission: ""
    message-list:
      - "%rc_prefix%&6Discord Server"
      - "&7• &fJoin our community: &6https://discord.gg/yourserver"
      - "&7• &fOnline Members: &61,234+"

  rules:
    enabled: true
    command: "rules"
    aliases: ["rule"]
    permission: ""
    message-list:
      - "%rc_prefix%&6Server Rules"
      - "&7• &fBe respectful to all players"
      - "&7• &fNo spamming or excessive caps"
      - "&7• &fNo advertising or self-promotion"
      - "&7• &fNo griefing or stealing"
      - "&7• &fUse appropriate language"

  store:
    enabled: true
    command: "store"
    aliases: ["shop"]
    permission: ""
    message: "%rc_prefix%&6Store &7• &fVisit our store: &6https://store.yourserver.com"

  help:
    enabled: true
    command: "help"
    aliases: ["?"]
    permission: ""
    message-list:
      - "%rc_prefix%&6Available Commands"
      - "&7• &#ffa500/discord &7- &fJoin our Discord community"
      - "&7• &#ffa500/rules &7- &fView server rules"
      - "&7• &#ffa500/store &7- &fVisit our store"
      - "&7• &#ffa500/help &7- &fShow this help message"
