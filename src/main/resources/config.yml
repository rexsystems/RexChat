# =============================================================================
#  RexChat — Configuration
# =============================================================================
#
#  Placeholders used throughout this file:
#    %rc_prefix%  — replaced with messages.prefix
#
#  After editing, run /rexchat reload (or restart the server).
#
# =============================================================================


# -----------------------------------------------------------------------------
#  General messages
# -----------------------------------------------------------------------------
messages:
  prefix: "&7[&6RexChat&7] "
  no-permission: "%rc_prefix%&cYou don't have permission to use this command."
  reload-success: "%rc_prefix%&aConfiguration reloaded successfully."
  command-not-found: "%rc_prefix%&cUnknown command."
  reload-usage: "%rc_prefix%&7Usage: &f/%cmd% reload"
  player-only: "%rc_prefix%&cThis command can only be used in-game."

  # Shown when a player @-mentions someone in chat
  mention:
    sender: "%rc_prefix%&aYou mentioned &6{targets}&a."
    target: "%rc_prefix%&eYou were mentioned by &6{sender}&e."

  # In-game preview GUIs and clickable chat tokens
  preview:
    target-not-found: "%rc_prefix%&cThat player is not online."
    item:
      title: "&6Item &8• &f{player}"
      none: "%rc_prefix%&7You are not holding any item."
      hover: "&7Click to view &f{player}&7's held item"
      text: "&7[&f{Item} &bx{Amount}&7]"
      singular-text: "&7[&f{Item}&7]"
      empty-label: "&7[&eHold an item to show it&7]"
      token-empty-error: "%rc_prefix%&cHold an item in your main hand to use this token."
      open: "%rc_prefix%&7Opening item preview for &6{player}&7…"
    inventory:
      title: "&6Inventory &8• &f{player}"
      hover: "&7Click to view &f{player}&7's inventory"
      label-template: "&7[&fInventory&7]"
      open: "%rc_prefix%&7Opening inventory preview for &6{player}&7…"
    enderchest:
      title: "&6Ender Chest &8• &f{player}"
      hover: "&7Click to view &f{player}&7's ender chest"
      label-template: "&7[&5Ender Chest&7]"
      open: "%rc_prefix%&7Opening ender chest preview for &6{player}&7…"
    balance:
      # Placeholders: {balance} (formatted), {amount} (raw), {currency}, {player}
      label-template: "&7[&a{balance}&7]"
      hover: "&7Balance of &6{player}&7: &a{balance}"
      unavailable-label: "&7[&cBalance unavailable&7]"
    coords:
      label-template: "&7[&b{x}, {y}, {z}&7]"
      hover: "&7Click to copy coordinates\n&7Staff: &f/rexchat tpcoords {id}"
      copy-format: "{x} {y} {z}"
      teleport-success: "%rc_prefix%&aTeleported to &6{player}&a's coordinates &7({x}, {y}, {z})"


# -----------------------------------------------------------------------------
#  Chat format
# -----------------------------------------------------------------------------
#  Placeholders (format + hover):
#    {player}, {display_name}, {message}, {prefix},
#    {world}, {health}, {max_health}, {x}, {y}, {z}, {ping}
#
#  With PlaceholderAPI + rexchat.chat.placeholders you can also use %placeholders%
#  inside hover lines (e.g. %player_gamemode%, %statistic_time_played%).
#
#  Related permissions:
#    rexchat.chatcolor         — & colour codes in chat
#    rexchat.chat.minimessage    — MiniMessage tags (<gradient>, <hover>, …)
#    rexchat.chat.placeholders   — PlaceholderAPI in chat messages
chat-format:
  enabled: true
  format: "{prefix}&7{player}&8: &f{message}"

  player:
    hover:
      enabled: true
      lines:
        - "&6&l{player}"
        - "&8&m                              "
        - "&7Rank: &f{prefix}"
        - "&7Display: &f{display_name}"
        - "&7Health: &c❤ &f{health}&7/&f{max_health}"
        - "&7World: &f{world}"
        - "&7Position: &f{x}&7, &f{y}&7, &f{z}"
        - "&7Ping: &a{ping}ms"
        - "&8&m                              "

  # Group overrides — first matching entry wins.
  # Match by LuckPerms / Vault primary group name, or set permission: explicitly.
  groups:
    helper:
      # permission: "group.helper"
      format: "{prefix}&7[&aHelper&7] &7{player}&8: &a{message}"
      hover:
        enabled: true
        lines:
          - "&a&l▸ Helper &8• &6{player}"
          - "&8&m                              "
          - "&7Team member — here to help players"
          - ""
          - "&7Rank: &aHelper &8• &7{prefix}"
          - "&7Health: &c{health}&7/&c{max_health}  &8•  &7Ping: &a{ping}ms"
          - "&7World: &f{world} &8@ &f{x}&7, &f{y}&7, &f{z}"
          - "&8&m                              "
          - "&7Need staff? Ask a &aHelper &7in chat"

    moderator:
      # permission: "group.moderator"
      format: "{prefix}&7[&bMod&7] &7{player}&8: &b{message}"
      hover:
        enabled: true
        lines:
          - "&b&l◆ Moderator &8• &6{player}"
          - "&8&m                              "
          - "&7Staff — keeps chat fair & rules enforced"
          - ""
          - "&7Rank: &bModerator &8• &7{prefix}"
          - "&7Health: &c{health}&7/&c{max_health}  &8•  &7Ping: &a{ping}ms"
          - "&7World: &f{world} &8@ &f{x}&7, &f{y}&7, &f{z}"
          - "&8&m                              "
          - "&7Report issues: &f/discord"

    admin:
      # permission: "group.admin"
      format: "{prefix}&7[&cAdmin&7] &7{player}&8: &c{message}"
      hover:
        enabled: true
        lines:
          - "&c&l⚡ Administrator &8• &6{player}"
          - "&8&m                              "
          - "&7Server administration & full access"
          - ""
          - "&7Rank: &cAdmin &8• &7{prefix}"
          - "&7Health: &c{health}&7/&c{max_health}  &8•  &7Ping: &a{ping}ms"
          - "&7World: &f{world} &8@ &f{x}&7, &f{y}&7, &f{z}"
          - "&8&m                              "
          - "&cOnline now &8— &7ping for urgent help"


# -----------------------------------------------------------------------------
#  Chat reporting (1.19+)
# -----------------------------------------------------------------------------
chat-reporting:
  # true = chat is sent without the signed-chat popup (Paper 1.19+)
  disable: true


# -----------------------------------------------------------------------------
#  Join & leave messages
# -----------------------------------------------------------------------------
#  Leave blank ("") to disable and use the server's default messages.
join-leave:
  join-message: ""
  leave-message: ""


# -----------------------------------------------------------------------------
#  Chat colour presets (/chatcolor)
# -----------------------------------------------------------------------------
chatcolor:
  enabled: true
  colors:
    red:
      format: "&c"
      permission: "rexchat.chatcolor.red"
      display-name: "Red"
    gold:
      format: "&6"
      permission: "rexchat.chatcolor.gold"
      display-name: "Gold"
    green:
      format: "&a"
      permission: "rexchat.chatcolor.green"
      display-name: "Green"
    aqua:
      format: "&b"
      permission: "rexchat.chatcolor.aqua"
      display-name: "Aqua"
    pink:
      format: "&d"
      permission: "rexchat.chatcolor.pink"
      display-name: "Pink"
    rainbow:
      format: "<rainbow>"
      permission: "rexchat.chatcolor.rainbow"
      display-name: "&cR&6a&ei&an&bb&do&5w"
    sunset:
      format: "<gradient:#FF6B6B:#FFE66D>"
      permission: "rexchat.chatcolor.sunset"
      display-name: "Sunset"
    ocean:
      format: "<gradient:#00B4DB:#0083B0>"
      permission: "rexchat.chatcolor.ocean"
      display-name: "Ocean"


# -----------------------------------------------------------------------------
#  Chat emojis
# -----------------------------------------------------------------------------
#  Aliases are matched as standalone tokens only (surrounded by space or
#  start/end of message) so ":)" won't trigger inside longer text.
chat-emoji:
  enabled: true
  emojis:
    - name: "smile"
      aliases: [":)", ":smile:"]
      replacement: "☺"
    - name: "heart"
      aliases: ["<3", ":heart:"]
      replacement: "❤"


# -----------------------------------------------------------------------------
#  Preview tokens ([item], [inv], [coords], …)
# -----------------------------------------------------------------------------
chat-previews:
  enabled: true
  tokens:
    item: ["[item]", "[i]", "{item}", "{i}"]
    inventory: ["[inventory]", "[inv]", "{inventory}", "{inv}"]
    enderchest: ["[enderchest]", "[ec]", "[echest]", "{enderchest}", "{ec}", "{echest}"]
    coords: ["[coords]", "[here]", "{coords}", "{here}"]
    # Requires Vault + an economy plugin (EssentialsX, CMI, …)
    balance: ["[balance]", "[bal]", "[money]", "{balance}", "{bal}", "{money}"]

  # Example custom token — enable and edit the URL for your server
  custom-tokens:
    discord:
      enabled: false
      tokens: ["[discord]", "{discord}"]
      label: "&9[&bDiscord&9]"
      hover: "&7Click to open our Discord"
      click-type: open_url
      click-value: "https://discord.gg/yourserver"
      permission: ""


# -----------------------------------------------------------------------------
#  @Mentions
# -----------------------------------------------------------------------------
mention:
  enabled: true
  color: "&6"
  by-name: true
  prevent-self: true

  sound:
    enabled: true
    name: "ENTITY_EXPERIENCE_ORB_PICKUP"
    volume: 0.8
    pitch: 1.2

  notify:
    sender: false
    target: true

  title:
    enabled: true
    title: "&6Mention!"
    subtitle: "&eYou were mentioned by &6{sender}"
    fade-in: 5
    stay: 40
    fade-out: 10


# -----------------------------------------------------------------------------
#  Moderation — mute, clear, proximity chat
# -----------------------------------------------------------------------------
chat-management:
  mute:
    enabled: true
    permission: "rexchat.mute"
    muted-message: "%rc_prefix%&cChat is currently muted."
    mute-announcement: "%rc_prefix%&cChat has been muted by &f{player}&c."
    unmute-announcement: "%rc_prefix%&aChat has been unmuted by &f{player}&a."

  clear:
    enabled: true
    permission: "rexchat.clear"
    clear-message: "%rc_prefix%&7Chat cleared by &f{player}&7."
    lines: 100

  proximity:
    enabled: false
    radius: 100
    bypass-permission: "rexchat.proximity.bypass"
    no-recipients-message: "%rc_prefix%&7No one nearby can hear you."
    show-range-indicator: true
    range-indicator: "&8[&7Local&8] "
    global-enabled: "%rc_prefix%&aGlobal chat enabled — everyone will see your messages."
    local-enabled: "%rc_prefix%&eLocal chat enabled — only nearby players will hear you."


# -----------------------------------------------------------------------------
#  DiscordSRV integration (optional — requires DiscordSRV on the server)
# -----------------------------------------------------------------------------
#  Relays in-game chat to Discord and renders [item] / [inv] / [ec] tokens as
#  Minecraft-style PNG images attached to the Discord message.
chat-discord:
  enabled: true
  debug: false

  previews:
    item: true
    item-container-contents: true
    inventory: true
    enderchest: true

  labels:
    inventory: "[Inventory]"
    enderchest: "[Ender Chest]"
    balance-unavailable: "(balance unavailable)"

  embeds:
    item:
      title: "{player}'s item"
      color: "#5865F2"
      icon-pixels: 96
      shulker:
        color: "#9B59B6"
      container:
        color: "#9B59B6"
    inventory:
      title: "{player}'s inventory"
      color: "#57F287"
    enderchest:
      title: "{player}'s ender chest"
      color: "#9B59B6"

  images:
    texture-base-url: "https://assets.mcasset.cloud/{version}/assets/minecraft/textures/"


# -----------------------------------------------------------------------------
#  Custom info commands (/discord, /rules, …)
# -----------------------------------------------------------------------------
commands:
  discord:
    enabled: true
    command: "discord"
    aliases: ["dc"]
    permission: ""
    message-list:
      - "%rc_prefix%&6Discord Server"
      - "&7Join our community: &bhttps://discord.gg/yourserver"

  rules:
    enabled: true
    command: "rules"
    aliases: ["rule"]
    permission: ""
    message-list:
      - "%rc_prefix%&6Server Rules"
      - "&7• &fBe respectful to all players"
      - "&7• &fNo spamming or excessive caps"
      - "&7• &fNo advertising or self-promotion"
      - "&7• &fNo griefing or stealing"
      - "&7• &fUse appropriate language"

  store:
    enabled: true
    command: "store"
    aliases: ["shop"]
    permission: ""
    message: "%rc_prefix%&6Store &8• &fhttps://store.yourserver.com"

  help:
    enabled: true
    command: "help"
    aliases: ["?"]
    permission: ""
    message-list:
      - "%rc_prefix%&6Commands"
      - "&7• &f/discord &8— &7Join our Discord"
      - "&7• &f/rules &8— &7View server rules"
      - "&7• &f/store &8— &7Visit the store"
      - "&7• &f/help &8— &7Show this list"


# -----------------------------------------------------------------------------
#  Update checker
# -----------------------------------------------------------------------------
update-checker:
  enabled: true
  notify-ops-on-join: false
  permission: "rexchat.admin"
  message: "%rc_prefix%&fA new version of &6RexChat &fis available: &a{latest}&7 (you have &f{current}&7). &fDownload: &bhttps://www.spigotmc.org/resources/rexchat.122562/"
