# RexChat Configuration


# Update checker
update-checker:
  enabled: true
  notify-ops-on-join: false
  permission: "rexchat.admin"
  message: "%rc_prefix%&fA new version of &cRexChat &fis available: &c{latest}&7 (current: &f{current}&7). &fDownload: &chttps://www.spigotmc.org/resources/rexchat.122562/"

# Message Settings
messages:
  prefix: "&7[&6RexChat&7] "
  no-permission: "%rc_prefix%&fYou don't have permission to use this command."
  reload-success: "%rc_prefix%&fReloaded successfully!"
  command-not-found: "%rc_prefix%&fCommand not found."
  reload-usage: "%rc_prefix%&fUsage: /%cmd% reload"
  player-only: "%rc_prefix%&fThis command can only be used by players!"
  mention:
    sender: "%rc_prefix%&aYou mentioned &6{targets}"
    target: "%rc_prefix%&eYou were mentioned by &6{sender}"
    # Prevent self-mention triggers (sounds/titles/notifications) while keeping highlight
    prevent-self: true
  preview:
    target-not-found: "%rc_prefix%&cPlayer not found."
    item:
      title: "&6Item: &f{player}"
      none: "%rc_prefix%&7You are not holding any item."
      hover: "&7Click to view {player}'s item"
      text: "&7[&f{Item} &bx{Amount}&7]"
      singular-text: "&7[&f{Item}&7]"
      empty-label: "&7[&eHold an item to show it&7]"
      token-empty-error: "%rc_prefix%&cYou need to hold an item to show it."
      open: "%rc_prefix%&7Opening item preview for &6{player}"
    inventory:
      title: "&6Inventory: &f{player}"
      hover: "&7Click to view {player}'s inventory"
      label-template: "&7[&fInventory&7]"
      open: "%rc_prefix%&7Opening inventory preview for &6{player}"
    enderchest:
      title: "&6Ender Chest: &f{player}"
      hover: "&7Click to view {player}'s ender chest"
      label-template: "&7[&5Ender Chest&7]"
      open: "%rc_prefix%&7Opening ender chest preview for &6{player}"
    balance:
      # Label shown in chat in place of [bal]/[balance].
      # Placeholders: {balance} (formatted), {amount} (raw decimal), {currency}, {player}
      label-template: "&7[&a{balance}&7]"
      # Hover text on the balance label
      hover: "&7Balance of &6{player}&7: &a{balance}"
      # Shown when Vault Economy is not installed/registered
      unavailable-label: "&7[&cBalance unavailable&7]"

mention:
  enabled: true
  color: "&6"
  by-name: true
  sound:
    enabled: true
    name: "ENTITY_EXPERIENCE_ORB_PICKUP"
    volume: 0.8
    pitch: 1.2
  notify:
    sender: false
    target: true
  title:
    enabled: true
    title: "&6Mention!"
    subtitle: "&eYou were mentioned by &6{sender}"
    fade-in: 5
    stay: 40
    fade-out: 10

# Join/Leave Messages (leave blank to disable)
join-leave:
  join-message: ""
  leave-message: ""

# Chat reporting (1.19+). When enabled, RexChat converts player chat into
# system messages to avoid signed chat reporting and validation issues.
chat-reporting:
  disable: true


# Chat Color Presets - Players can select from these using /chatcolor
# Remove or add colors as you wish - they won't regenerate automatically
chatcolor:
  enabled: true
  colors:
    red:
      format: "&c"
      permission: "rexchat.chatcolor.red"
      display-name: "Red"
    gold:
      format: "&6"
      permission: "rexchat.chatcolor.gold"
      display-name: "Gold"
    green:
      format: "&a"
      permission: "rexchat.chatcolor.green"
      display-name: "Green"
    aqua:
      format: "&b"
      permission: "rexchat.chatcolor.aqua"
      display-name: "Aqua"
    pink:
      format: "&d"
      permission: "rexchat.chatcolor.pink"
      display-name: "Pink"
    rainbow:
      format: '<rainbow>'
      permission: "rexchat.chatcolor.rainbow"
      display-name: "&cR&6a&ei&an&bb&do&5w"
    sunset:
      format: '<gradient:#FF6B6B:#FFE66D>'
      permission: "rexchat.chatcolor.sunset"
      display-name: "Sunset"
    ocean:
      format: '<gradient:#00B4DB:#0083B0>'
      permission: "rexchat.chatcolor.ocean"
      display-name: "Ocean"

# Chat Formatting
chat-format:
  enabled: true
  # Base format. Available placeholders:
  # {player}, {display_name}, {message}, {world}, {health}, {max_health}, {x}, {y}, {z}, {ping}
  # {prefix} resolves via LuckPerms/Vault directly (no PAPI required)
  #
  # Permissions:
  # - rexchat.chatcolor: Allows using color codes (&c, &#FF0000, #FF0000) in chat
  # - rexchat.chat.minimessage: Allows using MiniMessage tags (<click>, <hover>, <gradient>, etc.) in chat
  # - rexchat.chat.placeholders: Allows using PlaceholderAPI placeholders in chat messages
  format: "{prefix}&7{player}: &f{message}"
  player:
    hover:
      enabled: true
      # Lines shown on hover over the player's name. Supports same placeholders and colors.
      lines:
        - "&7Health: &c{health}&7/&c{max_health}"
        - "&7World: &f{world}"
        - "&7Location: &f{x}&7, &f{y}&7, &f{z}"
        - "&7Ping: &f{ping}ms"

  # Group-specific overrides (first matching group wins)
  # Uses LuckPerms/Vault primary group via PlaceholderAPI if available,
  # or matches by permission (e.g., group.<name>) or explicit permission below.
  groups:
    helper:
# permission: "group.helper"  # optional, if not using the primary group
      format: "{prefix}&7{player}: &a{message}"
      hover:
        enabled: true
        lines:
          - "&aHelper &7• &fPing: {ping}ms"
    moderator:
      # Optional explicit permission to match this group
      # permission: "group.moderator"
      format: "{prefix}&7{player}: &b{message}"
      hover:
        enabled: true
        lines:
          - "&bModerator &7• &fPing: {ping}ms"
    admin:
      # permission: "group.admin"
      format: "{prefix}&7{player}: &c{message}"
      hover:
        enabled: true
        lines:
          - "&cAdmin &7• &fPing: {ping}ms"

# Chat Emojis (enabled by default). Users can add more in the list below.
chat-emoji:
  enabled: true
  emojis:
    - name: "smile"
      aliases: [":)", ":smile:"]
      replacement: "☺"
    - name: "heart"
      aliases: ["<3", ":heart:"]
      replacement: "❤"

# Chat Previews
chat-previews:
  enabled: true
  tokens:
    item: ["[item]", "[i]", "{item}", "{i}"]
    inventory: ["[inventory]", "[inv]", "{inventory}", "{inv}"]
    enderchest: ["[enderchest]", "[ec]", "[echest]", "{enderchest}", "{ec}", "{echest}"]
    # Requires Vault + an Economy plugin (EssentialsX, CMI, etc.) to display balance
    balance: ["[balance]", "[bal]", "[money]", "{balance}", "{bal}", "{money}"]

# Discord integration via DiscordSRV (soft-dependency, optional).
# When DiscordSRV is installed RexChat hooks into its outbound chat pipeline:
#   1) [item] / [inv] / [ec] tokens are replaced with friendly text labels
#      (e.g. "[Diamond Sword × 32]") in the relayed Discord message.
#   2) The matching rich embed and/or rendered PNG (inventory or ender chest)
#      is queued and a hidden marker is appended to the message.
#   3) Once DiscordSRV has delivered the message, RexChat edits THAT SAME
#      message to attach the embeds + PNGs inline. So the chat shows up as
#      one clean Discord message per chat line, not a flurry of follow-ups.
# Works with both bot-relay and webhook delivery in DSRV (webhook editing
# uses DSRV's WebhookUtil internally).
chat-discord:
  enabled: true
  # Verbose debug logging for the Discord preview pipeline. When true the
  # plugin logs every texture HTTP fetch (OK / 404), each block-icon
  # resolver decision and each armour overlay attempt. Useful for
  # troubleshooting "block X doesn't show" or "armour isn't visible"
  # without having to dig through code. Leave OFF in production.
  debug: false
  # Per-token toggles for image/embed delivery. Token rewriting still happens
  # even when these are off (so chat shows the label) — this only controls
  # whether the rich preview is attached.
  previews:
    item: true
    inventory: true
    enderchest: true
  # Static fallback labels used in chat. The [item] label is built dynamically
  # from the held item ("[Diamond Sword × 32]"), so only inventory / ender
  # chest / balance-unavailable have a fixed string.
  labels:
    inventory: "[Inventory]"
    enderchest: "[Ender Chest]"
    balance-unavailable: "(balance unavailable)"
  embeds:
    item:
      title: "{player}'s item"
      # Color in #RRGGBB hex
      color: "#5865F2"
      # Size of the rendered item-icon thumbnail attached to the embed
      # (square, in pixels). The icon is shown as the small corner thumbnail;
      # the larger Minecraft-style hover tooltip (with name + enchants +
      # durability) is rendered separately and attached as the embed's main
      # image. 96 is a good balance for the corner thumbnail.
      icon-pixels: 96
      # Optional URL template (legacy). Used only if no rendered icon
      # attachment is produced. Supports {type} and {material} placeholders.
      image-url-template: ""
    inventory:
      title: "{player}'s inventory"
      color: "#57F287"
    enderchest:
      title: "{player}'s ender chest"
      color: "#9B59B6"

# Chat Management Settings
chat-management:
  mute:
    enabled: true
    permission: "rexchat.mute"
    muted-message: "%rc_prefix%&fThe chat is currently muted."
    mute-announcement: "%rc_prefix%&fThe chat has been muted by {player}"
    unmute-announcement: "%rc_prefix%&fThe chat has been unmuted by {player}"
  clear:
    enabled: true
    permission: "rexchat.clear"
    clear-message: "%rc_prefix%&fThe chat has been cleared by {player}"
    lines: 100
  proximity:
    # Global proximity chat - messages only visible to players within radius
    enabled: false
    # Radius in blocks
    radius: 100
    # Permission to bypass proximity limit (see global chat)
    bypass-permission: "rexchat.proximity.bypass"
    # Message shown to sender when no one is in range
    no-recipients-message: "%rc_prefix%&7No one is nearby to hear you."
    # Show range indicator in chat format (optional)
    show-range-indicator: false
    range-indicator: "&7[Local] "
    # Messages for /rc global and /rc local commands
    global-enabled: "%rc_prefix%&aGlobal chat enabled. Everyone will see your messages."
    local-enabled: "%rc_prefix%&eLocal chat enabled. Only nearby players will see your messages."

# Commands Configuration
commands:
  discord:
    enabled: true
    command: "discord"
    aliases: ["dc"]
    permission: ""
    message-list:
      - "%rc_prefix%&6Discord Server"
      - "&7• &fJoin our community: &6https://discord.gg/yourserver"
      - "&7• &fOnline Members: &61,234+"

  rules:
    enabled: true
    command: "rules"
    aliases: ["rule"]
    permission: ""
    message-list:
      - "%rc_prefix%&6Server Rules"
      - "&7• &fBe respectful to all players"
      - "&7• &fNo spamming or excessive caps"
      - "&7• &fNo advertising or self-promotion"
      - "&7• &fNo griefing or stealing"
      - "&7• &fUse appropriate language"

  store:
    enabled: true
    command: "store"
    aliases: ["shop"]
    permission: ""
    message: "%rc_prefix%&6Store &7• &fVisit our store: &6https://store.yourserver.com"

  help:
    enabled: true
    command: "help"
    aliases: ["?"]
    permission: ""
    message-list:
      - "%rc_prefix%&6Available Commands"
      - "&7• &#ffa500/discord &7- &fJoin our Discord community"
      - "&7• &#ffa500/rules &7- &fView server rules"
      - "&7• &#ffa500/store &7- &fVisit our store"
      - "&7• &#ffa500/help &7- &fShow this help message"