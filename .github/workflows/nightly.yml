name: Nightly Build

on:
  push:
    branches: [ main ]
  schedule:
    # Daily 02:00 UTC (only runs if main moved since last run)
    - cron: '0 2 * * *'
  workflow_dispatch:

# Allow back-to-back nightlies; each one gets its own release anyway
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Nightly
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Generate nightly version
        id: version
        run: |
          BASE_VERSION=$(grep -oP '(?<=<revision>)[^<]+' pom.xml | head -1)
          SHORT_SHA=$(git rev-parse --short HEAD)
          NIGHTLY_VERSION="${BASE_VERSION}-nightly.${GITHUB_RUN_NUMBER}+${SHORT_SHA}"
          NIGHTLY_TAG="nightly-${GITHUB_RUN_NUMBER}"
          echo "version=${NIGHTLY_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${NIGHTLY_TAG}" >> "$GITHUB_OUTPUT"
          echo "base_version=${BASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Building nightly: ${NIGHTLY_VERSION} (tag: ${NIGHTLY_TAG})"

      - name: Build with Maven
        run: |
          mvn -B -ntp clean package \
            -Drevision=${{ steps.version.outputs.version }} \
            --no-transfer-progress \
            -DskipTests

      - name: Locate built JAR
        id: jar
        run: |
          JAR=$(ls target/*.jar | grep -v 'original-' | grep -v 'sources' | grep -v 'javadoc' | head -n 1)
          if [ -z "$JAR" ]; then
            echo "::error::No JAR found in target/"
            exit 1
          fi
          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$JAR")" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RexChat-nightly-${{ github.run_number }}
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Create nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "RexChat Nightly #${{ github.run_number }} (${{ steps.version.outputs.version }})"
          prerelease: true
          files: ${{ steps.jar.outputs.path }}
          body: |
            ## RexChat Nightly Build

            **Version:** `${{ steps.version.outputs.version }}`
            **Commit:** ${{ github.sha }}
            **Branch:** `${{ github.ref_name }}`
            **Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            ---

            > ⚠️ This is an automated nightly build. It may be unstable.
            > For production servers, use a stable [release](${{ github.server_url }}/${{ github.repository }}/releases?q=v&expanded=false).

            ### Latest commit

            ${{ github.event.head_commit.message }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
