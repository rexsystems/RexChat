name: Release

on:
  push:
    tags:
      - 'v*'
  # Allow manually triggering a release for an existing tag (or to retry a failed run)
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v1.6.5)'
        required: true

# Don't cancel an in-progress release; back-to-back tags should each finish
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Determine version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing tag=$TAG version=$VERSION"

      - name: Set Maven version from tag
        run: |
          mvn -B -ntp versions:set \
            -DnewVersion=${{ steps.version.outputs.version }} \
            -DgenerateBackupPoms=false

      - name: Build with Maven
        run: mvn -B -ntp clean package

      - name: Locate built JAR
        id: jar
        run: |
          JAR=$(ls target/*.jar | grep -v 'original-' | grep -v 'sources' | grep -v 'javadoc' | head -n 1)
          if [ -z "$JAR" ]; then
            echo "::error::No JAR found in target/"
            exit 1
          fi
          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          echo "Built JAR: $JAR"

      - name: Publish to GitHub Release & Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          # ---- GitHub Release ----
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ steps.version.outputs.tag }}
          github-generate-changelog: false
          github-draft: false
          github-prerelease: false

          # ---- Modrinth ----
          modrinth-id: rexchat
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: true
          modrinth-unfeature-mode: subset

          # ---- Shared metadata ----
          name: RexChat ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          version-type: release
          files: ${{ steps.jar.outputs.path }}
          # Read changelog from CHANGELOG.md (mc-publish picks the section
          # matching the version being released).
          changelog-file: CHANGELOG.md

          loaders: |
            paper
            purpur
            folia
            bukkit
            spigot

          # mc-publish accepts version ranges; releases-only filter strips snapshots/pre-releases
          game-versions: |
            >=1.20.4
          game-version-filter: releases

          java: |
            21

          retry-attempts: 2
          retry-delay: 10000
          fail-mode: fail
